<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found – Stream Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#101010;--panel:#181818;--line:rgba(255,255,255,.14);--text:#ffffff;--muted:#b8b8b8;--accent:#E9C030}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--text);font:16px/1.6 "Poppins",system-ui,sans-serif}
main{width:100%;max-width:560px;text-align:center}
.badge{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.code{margin:18px 0 0;font-size:clamp(88px,24vw,168px);font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--accent)}
h1{margin:8px 0 10px;font-size:clamp(24px,6vw,34px);line-height:1.2}
p{margin:0 0 26px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:4px;background:var(--accent);color:#101010;font-weight:600;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.note{margin-top:28px;font-size:13px}
</style>
</head>
<body>
<main>
  <span class="badge">STREAM DASHBOARD</span>
  <div class="code" aria-hidden="true">404</div>
  <h1>This page doesn’t exist</h1>
  <p>The link may be old or mistyped. The setup guide is one click away.</p>
  <a class="btn" href="/">Back to the setup guide</a>
  <p class="note">Looking for the dock file or the action import string? They’re in the Quick access section of the guide.</p>
</main>
</body>
</html>
